<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AccessPatch PDF</title><link rel="stylesheet" href="pdf-viewer.css"></head><body><header><strong>AccessPatch · PDF helper</strong><button id="original">View original</button><button id="download" hidden>Download my copy</button></header><section id="welcome"><h1>A little help with this PDF.</h1><p>Select a field. Ask your companion.</p><button id="open">Open with AccessPatch</button></section><p id="status" role="status"></p><main id="workspace" hidden><section id="document"><nav><button id="previous">Previous</button><span id="page-number"></span><button id="next">Next</button><label>Zoom <select id="zoom"><option value="1">100%</option><option value="1.3" selected>130%</option><option value="1.7">170%</option></select></label></nav><div id="paper"><canvas></canvas><div id="fields"></div></div></section><aside><exode-mascot src="files/ip-2016.bexode" aria-hidden="true"></exode-mascot><div class="bubble"><h2>One field at a time.</h2><p id="selected">Select a field in the PDF.</p><p class="quiet">Field values stay in this tab. Keep personal details out of your questions.</p><form id="ask"><label for="question">Your question</label><textarea id="question" required maxlength="1000" placeholder="What goes here?"></textarea><button id="send" disabled>Ask companion</button></form><div id="answer" aria-live="polite"></div><details><summary>View sources</summary><div id="sources">No sources retrieved yet.</div></details><button id="settings">Connection settings</button></div></aside></main><script src="exode-mascot.js"></script><script type="module" src="pdf-viewer.mjs"></script></body></html>

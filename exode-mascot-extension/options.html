<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exode Mascot options</title>
  <style>
    body { max-width: 620px; margin: 48px auto; padding: 0 24px; color: #252525; font: 16px/1.5 system-ui, sans-serif; }
    h1 { font-size: 26px; }
    label { display: block; margin: 24px 0 8px; font-weight: 600; }
    input[type="password"], input[type="text"] { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; }
    .toggle { display: flex; align-items: center; gap: 10px; }
    button { margin-top: 14px; padding: 10px 16px; font: inherit; cursor: pointer; }
    .hint, #status { color: #555; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Exode Mascot options</h1>
  <p>The extension calls ElevenLabs directly. No local backend is required. Your key is stored in this browser’s extension storage and is not included in the extension source.</p>
  <label class="toggle" for="voice-enabled"><input id="voice-enabled" type="checkbox"> Play message voices</label>
  <label for="voice-id">ElevenLabs voice ID</label>
  <input id="voice-id" type="text" autocomplete="off" spellcheck="false">
  <label for="api-key">ElevenLabs API key</label>
  <input id="api-key" type="password" autocomplete="off" spellcheck="false">
  <button id="save">Save voice settings</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
